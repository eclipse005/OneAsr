# cargo-deny 配置 —— 依赖安全与来源治理。
#
# 为什么选 cargo-deny 而不是 cargo-audit：
#   cargo-audit 只做「已知漏洞」一件事；本项目真正的供应链风险面更大 ——
#   产物里含 7 个 GitHub git 依赖（6 个直接声明：qwen3-asr-wgpu /
#   qwen3-aligner-wgpu / fireredvad / demucs-core / punkt /
#   sensevoice-small-wgpu，外加传递依赖 nagisa-rs）。cargo-deny 能把
#   「git 依赖只能来自这份显式清单、而且必须带 tag/rev 说明符」写成硬规则，
#   [advisories] 同时覆盖漏洞。
#   一个工具、一份配置、一条命令，比两个工具更好维护。
#
# 运行（本地与 CI 同一条命令）：
#   cargo deny check advisories sources
#
# 目前只开 advisories 与 sources 两项，都是「有事实依据就能判定」的检查。
# 暂不启用 [licenses] / [bans]：它们一开就会大面积报出与本次治理无关的历史债
# （许可证组合、重复版本），先把真正要守的两条守住；将来要收紧许可证或去重时
# 再按需打开，并当次把报出来的问题一并处理掉。

[graph]
# 只按仓库实际交付的目标评估依赖图，避免把只在其他平台出现的可选依赖算进风险面。
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[advisories]
version = 2
# 公告库本身也钉死：`vendor/advisory-db` 是 RustSec 官方库的 submodule，锁在
# 某个 commit 上；CI 与本地读的是同一份快照，**不会**因为上游 main 新增通告而
# 把与本次提交无关的东西弄红（2026-10-16 的 zip 被 yank、2026-10-17 的 zip 三条
# 漏洞都是这么进来的：同一份代码，前一天绿、后一天红）。
#
# cargo-deny 的 db-path 是「缓存根」而不是库本体，每个库要落在
# <root>/<name>-<hash> 里；准备这份快照是 scripts/prepare-advisory-db.ps1 的职责
# （CI 在跑 deny 之前调用它，本地也一样）：
#   pwsh -File scripts/prepare-advisory-db.ps1
#   cargo deny check advisories sources
# 脚本把 submodule 克隆成本地镜像放进 cargo-deny 的默认缓存根，fetch 只连本地镜像。
#
# 更新是手动动作，只在明确要升的时候做（没有定时任务，也不跟随上游）：
#   git -C vendor/advisory-db fetch origin
#   git -C vendor/advisory-db checkout <新 commit>   # 然后 git add vendor/advisory-db
#   pwsh -File scripts/prepare-advisory-db.ps1       # 重建缓存后重跑上面的检查
# 首次 clone 后需要：git submodule update --init vendor/advisory-db
# 被 yank 的版本继续用下去会把别人踩过的坑留在产物里；Cargo.lock 是入库的，
# 出现 yanked 就说明锁文件该更新了，直接失败。
#
# 2026-10-16 起**暂降为 warn**：zip 上游当天凌晨把 9.0.3 之前的全部版本一次性
# yank（crates.io 上 `cargo update -p zip` 已无未撤回版本可选），而三个引擎
# 依赖链（demucs-core / sensevoice-small-wgpu 直接钉 `zip = "2"`；fireredvad
# 经 ndarray-npy 0.9 间接钉 `zip = "2"`）都还停在 2.x —— 门禁提示的那条
# 「更新锁文件」修复路径被堵死，硬失败只会让
# 这条门禁长期变红、被当成噪音（与上面 unmaintained 一节同一个道理）。
# 告警仍会打印，问题没有隐身。zip 2.4.2 随后在 2026-10-16 又被收录三条
# extract() 路径的通告（RUSTSEC-2026-0367/0368/0369，修复在 9.0.0）；它们与
# 本图的实际调用面无关，见下面 ignore 的说明。
# 摘掉这个限制的条件：三个引擎仓库升级到 zip 9.x（当前未 yank 的线）并重新
# 钉 rev 之后，把这里改回 deny。
yanked = "warn"
# unmaintained = "workspace"：只把「本仓库直接依赖」里的停维护 crate 当错误。
#
# 为什么不是默认的 "all"：2026-09-27 实测 `cargo deny check advisories` 在
# 全量模式下报出 4 个**传递**依赖的「已停维护」通告，作者全都改不动 ——
# 一个都修不了的门禁等于没有门禁，只会被无视：
#   RUSTSEC-2025-0052 async-std（已停止开发）
#   RUSTSEC-2024-0436 paste
#   RUSTSEC-2026-0173 proc-macro-error2
#   RUSTSEC-2025-0134 rustls-pemfile
# 这 4 个都是「停维护」通告，**没有一个是真正的漏洞**（RustSec 里带
# vulnerability 的通告仍然是硬错误，无法被本配置降级）。
# 想连传递依赖一起看时，本地跑：
#   cargo deny check advisories --config 'advisories.unmaintained="all"'
unmaintained = "workspace"
# 默认空：不靠 ignore 屏蔽通告，真正的漏洞如实暴露。
# 例外只允许「已确认不可达、且图上暂时升不上去」的通告，必须写清理由与移除条件；
# 公告库已钉住，所以例外集合不会随上游自己变化。
ignore = [
    # 2026-10-16 收录，均只影响 zip < 9.0.0 的 extract()/extract_stream 路径
    # （SUID/SGID 位保留、符号链接越界、经符号链接套用权限）。
    # 本依赖图只调 ZipArchive::new + by_name/by_index 读模型归档，没有任何一处
    # 调用 extract()，也不解压用户提供的 zip；对 OneAsr 不可达。
    # zip 9 目前进不来：demucs-core / sensevoice 直接钉 zip="2"，ndarray-npy 0.9.1
    # 钉 "2"（其最新 0.10.0 也只到 ^6），fireredvad 用 ndarray-npy 0.9。
    # 移除条件：ndarray-npy 支持 zip>=9（或 fireredvad 去掉它）且三个引擎 rev
    # 升到 zip 9 之后，删掉这三行。
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[sources]
# 依赖只允许来自 crates.io（默认）与 allow-git 里逐个列出的仓库。
unknown-registry = "deny"
unknown-git = "deny"
# allow-git 是「精确 URL」匹配，不支持通配符（docs：the url must match exactly），
# 所以下面逐个列出，.git 后缀按 cargo 的归一化省掉。
# 代价是新增一个 git 依赖必须同时改这里 —— 这正是想要的：来路不明的 fork
# 会在 CI 被拦下，而不是静静进入产物。
allow-git = [
    "https://github.com/eclipse005/FireRedVad",
    "https://github.com/eclipse005/ctc-forced-aligner-wgpu",
    "https://github.com/eclipse005/demucs-wgpu",
    # 传递依赖：qwen3-aligner-wgpu 自己拉了 nagisa-rs，不是本仓库直接声明的，
    # 但同样会被打进产物，所以一样要在清单里（这条就是 check sources 逼出来的）。
    "https://github.com/eclipse005/nagisa-rs",
    "https://github.com/eclipse005/qwen3-aligner-wgpu",
    "https://github.com/eclipse005/qwen3-asr-wgpu",
    "https://github.com/eclipse005/rust-punkt",
    # 热词粗转（SenseVoiceSmall，wgpu）：只服务「先粗转再召回」那一趟，
    # 不参与正式转写，但同样会被打进产物。
    "https://github.com/eclipse005/sensevoice-small-wgpu",
]
# 必须带 tag 或 rev：不写说明符的 git 依赖会跟踪默认分支最新提交，
# 同一份源码能构建出不同产物。用 rev 也可以（更具体），tag 是允许的底线。
required-git-spec = "tag"
# 清单里列了却没被任何 crate 用到的 URL 直接报错：既防呆（写错 URL 或
# 匹配不到的写法会立刻暴露），也防止删掉依赖后清单烂在那里。
unused-allowed-source = "deny"
