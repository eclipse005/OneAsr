[workspace]
resolver = "2"
members = [
    "crates/oneasr-core",
    "crates/oneasr",
]

[workspace.package]
version = "1.4.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
oneasr-core = { path = "crates/oneasr-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# Shipped binaries are release-only; thin LTO + single codegen unit keep the
# 40–56 MB GPU-enabled executables from growing and improve startup. Panics
# stay unwinding because the GUI worker supervises tasks with `catch_unwind`.
[profile.release]
lto = "thin"
codegen-units = 1

# 这条分支的界面是 Native Shell，不再链 gpui。gpu-allocator 仍要钉在
# 与 wgpu-hal 30 的 DX12 类型一致的 0.28（vendor 补丁）。
[patch.crates-io]
gpu-allocator = { path = "vendor/gpu-allocator" }
