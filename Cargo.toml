[workspace]
resolver = "2"
members = [
    "crates/oneasr-core",
]

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
oneasr-core = { path = "crates/oneasr-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# Shipped binaries are release-only; thin LTO + single codegen unit keep the
# GPU-enabled CLI from growing and improve startup. Panics stay unwinding
# because the pipeline supervises runs with `catch_unwind`.
[profile.release]
lto = "thin"
codegen-units = 1

# Pin gpu-allocator's windows dependency to 0.62 so its DX12 types match
# wgpu-hal 30. Details: vendor/gpu-allocator/PATCHES.md.
[patch.crates-io]
gpu-allocator = { path = "vendor/gpu-allocator" }
