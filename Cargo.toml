[workspace]
resolver = "2"
members = [
    "crates/oneasr-core",
    "crates/oneasr",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
oneasr-core = { path = "crates/oneasr-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
