# 提交 / PR 门禁：格式、lint、测试、跨平台编译、版本一致性、界面文案双语、供应链。
#
# 与 release.yml 的分工：
#   本文件 —— 每次提交都验证，只读权限，不做任何发布动作。
#   发布 —— tag 触发的打包与建 release 全在 release.yml，那里才需要写权限。
#
# 关于 tag 与版本号的断言：tag 只会在 release.yml 里出现，所以「tag 必须等于
# Cargo.toml 版本」这一条在那里做（两个文件调用的是同一个
# scripts/verify-version.py，规则只有一份）。本文件只校验 Cargo.toml 与两份 README。
name: CI

on:
  # 主分支是 master，而且不走过 PR 直接提交 —— push 检查才是真正拦住坏代码的门。
  # PR 检查保留：外部贡献或任何以 PR 形式进来的改动同样要过同一道门禁。
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 最小权限。CI 只需要读代码；写权限只在 release.yml 的 publish job 里给。
permissions:
  contents: read

# 同一分支/PR 上的新提交取消上一次运行：省 runner，也让结论只对最新提交负责。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 镜像标签一律写死具体版本，不用 *-latest：2026-10-19 起 ubuntu-latest 迁到
# 26.04，同一份提交会在没人改代码的情况下换一套 glibc / apt 源。要换是一次显式提交。
#   ubuntu-24.04 / windows-2022 / macos-15（arm64，与发布产物的 --arch arm64 对齐）

env:
  CARGO_TERM_COLOR: always
  # 与发布构建保持一致；CI 里增量编译没有收益，只会占满磁盘。
  CARGO_INCREMENTAL: "0"

jobs:
  # ── 1. 格式：最便宜的一道门，先失败先报 ──────────────────────────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 工具链版本只认 rust-toolchain.toml，workflow 里不再写第二个版本号。
      - id: toolchain
        name: Read pinned toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - run: cargo fmt --all --check

  # ── 2. lint + 测试：同一个 job 共用编译产物，不为同一套依赖编两遍 ──────
  check:
    name: clippy + test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 与 release.yml 的 Linux 构建同一套原生依赖，避免 CI 绿而发布红。
      - name: Native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config clang \
            libssl-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libx11-dev libxrandr-dev libxcb1-dev \
            libzstd-dev
      - id: toolchain
        name: Read pinned toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # --workspace --all-targets：连 oneasr-core 的 tests / examples 一起 lint。
      # （以前只写 -p oneasr，core 的测试代码因此长期没人 lint。）
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --locked -p oneasr-core -p oneasr

  # ── 3. 静态断言：版本一致性 + 界面文案双语 ─────────────────────────────
  # 三样都只用 Python 标准库、不碰 Rust 工具链，所以这个 job 秒完。
  version:
    name: version + i18n consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cargo.toml 是唯一来源，两份 README 必须跟它一致。
      - name: Version consistency
        run: python3 scripts/verify-version.py
      # 界面文案双语规则的机器化（AGENTS.md 的「代码风格」）：渲染层不许
      # 绕过双语表硬编码单语字符串、中文不许落进 UiLang::En 臂、
      # Str::new 两侧占位符必须成对且英文侧非空、expand 的 key 必须与条目
      # 占位符对齐。五样编译器都看不见。
      #
      # 门禁自己也要有测试：改坏它的一条正则，它会**静默地永远放绿**，
      # 那比门禁本身的红更危险——连「被拦住过」都不是了。所以先证明校验
      # 本身有效，再让它去校验别人。
      - name: i18n gate self-test
        run: python3 scripts/test_verify_i18n.py
      - name: i18n consistency
        run: python3 scripts/verify-i18n.py

  # ── 4. 供应链：外部二进制的哈希 + 依赖漏洞与来源 ───────────────────────
  supply-chain:
    name: supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # 公告库快照是 submodule，必须一起检出；下面的 prepare 步骤会把它铺成
      # cargo-deny 的缓存布局（它认的是 <root>/<name>-<hash>，不是库本体目录）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # ffmpeg 来自上游 Tyrrrz/FFmpegBin 的版本化 tag，归档仍可被重新上传，
      # 所以用哈希清单锁内容：资产被换掉时在这里就红，而不是等打包或用户下载后才发现。
      # 来源（base-url）与哈希都由 scripts/ffmpeg-checksums.txt 声明，本步骤不含硬编码 URL。
      - name: Verify bundled ffmpeg digests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verify-ffmpeg-manifest.py
      # 依赖漏洞 + 依赖来源（deny.toml：只允许 crates.io 与本组织 GitHub 仓库，
      # 且 git 依赖必须带 tag/rev）。
      #
      # 这里刻意不用第三方 action，而是按仓库自己的规矩来：钉版本 + 校验上游
      # 随资产发布的 sha256 —— 与我们对待 ffmpeg 的做法一致。少了这个 action，
      # 也就少了「action 内部下载二进制、而这一步没有任何校验」的环节。
      # 升级版本：改 VER，脚本会自己用新资产自带的 .sha256 校验，校验不过就红。
      #
      # 公告库不联网：vendor/advisory-db 这份 submodule 快照由 prepare 脚本铺成
      # cargo-deny 的缓存布局，它随后的 fetch 只在本地镜像里打转。上游 main 新增
      # 通告因此不会把与本次提交无关的东西弄红（更新是显式动作，见 deny.toml）。
      - id: toolchain
        name: Read pinned toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      # 脚本用 pwsh 写（本地 Windows PowerShell 5.1 也能跑），ubuntu 的 runner 自带 pwsh。
      - name: Pin the advisory database snapshot
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/prepare-advisory-db.ps1
      - name: cargo-deny (advisories + sources)
        shell: bash
        run: |
          set -euo pipefail
          VER=0.20.2
          TRIPLE=x86_64-unknown-linux-musl
          BASE="https://github.com/EmbarkStudios/cargo-deny/releases/download/${VER}"
          ASSET="cargo-deny-${VER}-${TRIPLE}.tar.gz"
          curl -sSfL --retry 3 -o "/tmp/${ASSET}" "${BASE}/${ASSET}"
          curl -sSfL --retry 3 -o "/tmp/${ASSET}.sha256" "${BASE}/${ASSET}.sha256"
          # 上游随资产发布的 .sha256 是这里的信任锚点，不一致就中止。
          echo "$(awk '{print $1}' "/tmp/${ASSET}.sha256")  /tmp/${ASSET}" | sha256sum -c -
          tar -xzf "/tmp/${ASSET}" -C /tmp
          # 不用 --locked：cargo-deny 的 --locked 是全局参数、不能跟在 check 后面；
          # 锁文件的一致性由上面的 clippy / test（都带 --locked）负责把关。
          "/tmp/cargo-deny-${VER}-${TRIPLE}/cargo-deny" check advisories sources

  # ── 5. 跨平台编译：lint 与测试只在 ubuntu 跑，Windows 靠本地开发覆盖，
  #      macOS 得等到发版打包才第一次编译 —— v1.2.0 的 GPU/CTC 依赖雷正是
  #      从这个空档里过去的。这里一个 cargo check 把「发版才炸」提前到
  #      「提交即红」。不做 clippy、不跑测试：拦编译失败就够，那两样 ubuntu
  #      已经全量跑过，别让矩阵翻倍烧 runner。
  cross-check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 同样钉死：macos-15 是 arm64（与发布产物的 --arch arm64 对齐），
        # windows-2022 是当前稳定的 Server 镜像。要换版本是一次显式提交。
        os: [macos-15, windows-2022]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        name: Read pinned toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check
        run: cargo check --locked --workspace --all-targets
