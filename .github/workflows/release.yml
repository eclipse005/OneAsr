# Tag v* (e.g. v1.1.0) on this repo → build installers and attach them to a
# GitHub Release. workflow_dispatch builds artifacts without publishing.
#
# Expected files on a tag (one artifact = one file, names match the download):
#   OneAsr_<ver>_windows_setup.exe
#   OneAsr_<ver>_windows_portable.zip
#   OneAsr_<ver>_linux_x64.deb
#   OneAsr_<ver>_linux_x64.tar.gz
#   OneAsr_<ver>_macos.dmg
#
# <ver> 只有一个来源：根 Cargo.toml 的 [workspace.package] version。
# tag 只是触发器和校验对象 —— version job 会断言 `v<Cargo.toml 版本>` 与
# 推上来的 tag 完全一致，不一致就直接失败（以前这里直接取 tag 名当版本号，
# 从不核对 Cargo.toml，能构建出一个文件名与内容不符的产物）。
#
# 打包脚本不再接受版本号参数：它们自己从 Cargo.toml 读，无法被调用方改错。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 默认最小权限：只有 publish job 需要写权限，写权限在那里单独声明。
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 与 CI 用的是同一个脚本：tag / Cargo.toml / 两份 README 的下载链接
      # 必须三方一致，否则不打包。stdout 只输出版本号。
      - id: ver
        name: Assert tag matches Cargo.toml, then read the version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="$(python3 scripts/verify-version.py --tag "${GITHUB_REF_NAME}")"
          else
            V="$(python3 scripts/verify-version.py)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "OneAsr $V"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        name: Read pinned toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-windows
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      # 版本号、--locked 构建、ffmpeg 哈希校验、缺 ISCC 时失败 —— 都在脚本里；
      # 脚本不接受版本参数，所以这里也不可能传错版本。
      - name: Pack
        shell: pwsh
        run: ./scripts/pack-release.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OneAsr_${{ needs.version.outputs.version }}_windows_setup.exe
          path: release/OneAsr_*_windows_setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OneAsr_${{ needs.version.outputs.version }}_windows_portable.zip
          path: release/OneAsr_*_windows_portable.zip
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config clang \
            libssl-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libx11-dev libxrandr-dev libxcb1-dev \
            libzstd-dev
      - id: toolchain
        name: Read pinned toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-linux
      - name: Pack
        run: |
          chmod +x scripts/pack-unix.sh
          ./scripts/pack-unix.sh --os linux --arch x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OneAsr_${{ needs.version.outputs.version }}_linux_x64.deb
          path: release/OneAsr_*_linux_x64.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OneAsr_${{ needs.version.outputs.version }}_linux_x64.tar.gz
          path: release/OneAsr_*_linux_x64.tar.gz
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        name: Read pinned toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-macos
      - name: Pack
        run: |
          chmod +x scripts/pack-unix.sh
          ./scripts/pack-unix.sh --os macos --arch arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OneAsr_${{ needs.version.outputs.version }}_macos.dmg
          path: release/OneAsr_*_macos.dmg
          if-no-files-found: error

  publish:
    needs: [version, windows, linux, macos]
    if: ${{ always() && !cancelled() && needs.version.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 只有这一步真的需要写权限（建 release、传资产）。
    permissions:
      contents: write
    steps:
      # Tags + full history: the release body is built from them below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: src
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true
      - name: Files
        run: ls -lh out
      - name: Verify all release artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "OneAsr_${VERSION}_windows_setup.exe"
            "OneAsr_${VERSION}_windows_portable.zip"
            "OneAsr_${VERSION}_linux_x64.deb"
            "OneAsr_${VERSION}_linux_x64.tar.gz"
            "OneAsr_${VERSION}_macos.dmg"
          )
          for artifact in "${expected[@]}"; do
            test -s "out/$artifact" || {
              echo "Missing or empty release artifact: out/$artifact" >&2
              exit 1
            }
          done
      # GitHub's own generator only lists *pull requests*, and this repo commits
      # straight to the branch — that produced a bare "Full Changelog" line.
      # So: use docs/release-notes/<tag>.md when it exists (hand-written, bilingual
      # notes win), otherwise list the commit subjects since the previous tag.
      - name: Release body
        working-directory: src
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -f "docs/release-notes/$TAG.md" ]]; then
            cp "docs/release-notes/$TAG.md" ../RELEASE_BODY.md
            echo "body: docs/release-notes/$TAG.md"
            exit 0
          fi
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## Changes"
            echo
            if [[ -n "$PREV" ]]; then
              echo "Since \`$PREV\`:"
              echo
              git log --no-merges --pretty=format:'- %s (`%h`)' "$PREV..$TAG"
              printf '\n\n**Full diff**: https://github.com/%s/compare/%s...%s\n' "$REPO" "$PREV" "$TAG"
            else
              git log --no-merges --pretty=format:'- %s (`%h`)' "$TAG"
              echo
            fi
          } > ../RELEASE_BODY.md
          echo '--- generated body ---'
          cat ../RELEASE_BODY.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: OneAsr ${{ needs.version.outputs.version }}
          body_path: RELEASE_BODY.md
          fail_on_unmatched_files: true
          files: out/*
