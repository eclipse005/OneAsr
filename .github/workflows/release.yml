# Tag v1.0.1 (or any v*) on this repo → build installers and attach them
# to a GitHub Release. workflow_dispatch builds artifacts without publishing.
#
# Expected files on a tag (one artifact = one file, names match the download):
#   OneAsr_<ver>_windows_setup.exe
#   OneAsr_<ver>_windows_portable.zip
#   OneAsr_<ver>_linux_x64.deb
#   OneAsr_<ver>_linux_x64.tar.gz
#   OneAsr_<ver>_macos.dmg
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(python3 -c "import re,pathlib; t=pathlib.Path('Cargo.toml').read_text(); m=re.search(r'(?m)^version\\s*=\\s*\\\"([^\\\"]+)\\\"', t); print(m.group(1) if m else '')")"
          fi
          [[ -n "$V" ]]
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "OneAsr $V"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Pack
        shell: pwsh
        run: ./scripts/pack-release.ps1 -Version ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: OneAsr_${{ needs.version.outputs.version }}_windows_setup.exe
          path: release/OneAsr_*_windows_setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: OneAsr_${{ needs.version.outputs.version }}_windows_portable.zip
          path: release/OneAsr_*_windows_portable.zip
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config clang \
            libssl-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libx11-dev libxrandr-dev libxcb1-dev \
            libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
      - name: Pack
        run: |
          chmod +x scripts/pack-unix.sh
          ./scripts/pack-unix.sh --version ${{ needs.version.outputs.version }} --os linux --arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: OneAsr_${{ needs.version.outputs.version }}_linux_x64.deb
          path: release/OneAsr_*_linux_x64.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: OneAsr_${{ needs.version.outputs.version }}_linux_x64.tar.gz
          path: release/OneAsr_*_linux_x64.tar.gz
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos
      - name: Pack
        run: |
          chmod +x scripts/pack-unix.sh
          ./scripts/pack-unix.sh --version ${{ needs.version.outputs.version }} --os macos --arch arm64
      - uses: actions/upload-artifact@v4
        with:
          name: OneAsr_${{ needs.version.outputs.version }}_macos.dmg
          path: release/OneAsr_*_macos.dmg
          if-no-files-found: error

  publish:
    needs: [version, windows, linux, macos]
    if: ${{ always() && !cancelled() && needs.version.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      # Tags + full history: the release body is built from them below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Files
        run: ls -lh out
      - name: Verify all release artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "OneAsr_${VERSION}_windows_setup.exe"
            "OneAsr_${VERSION}_windows_portable.zip"
            "OneAsr_${VERSION}_linux_x64.deb"
            "OneAsr_${VERSION}_linux_x64.tar.gz"
            "OneAsr_${VERSION}_macos.dmg"
          )
          for artifact in "${expected[@]}"; do
            test -s "out/$artifact" || {
              echo "Missing or empty release artifact: out/$artifact" >&2
              exit 1
            }
          done
      # GitHub's own generator only lists *pull requests*, and this repo commits
      # straight to the branch — that produced a bare "Full Changelog" line.
      # So: use docs/release-notes/<tag>.md when it exists (hand-written notes
      # win), otherwise list the commit subjects since the previous tag.
      - name: Release body
        working-directory: src
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -f "docs/release-notes/$TAG.md" ]]; then
            cp "docs/release-notes/$TAG.md" ../RELEASE_BODY.md
            echo "body: docs/release-notes/$TAG.md"
            exit 0
          fi
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## 本次改动"
            echo
            if [[ -n "$PREV" ]]; then
              echo "自 \`$PREV\` 起："
              echo
              git log --no-merges --pretty=format:'- %s (`%h`)' "$PREV..$TAG"
              printf '\n\n**完整对比**：https://github.com/%s/compare/%s...%s\n' "$REPO" "$PREV" "$TAG"
            else
              git log --no-merges --pretty=format:'- %s (`%h`)' "$TAG"
              echo
            fi
          } > ../RELEASE_BODY.md
          echo '--- generated body ---'
          cat ../RELEASE_BODY.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OneAsr ${{ needs.version.outputs.version }}
          body_path: RELEASE_BODY.md
          fail_on_unmatched_files: true
          files: out/*
