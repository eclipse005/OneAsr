# Tag v1.0.1 (or any v*) on this repo → build installers and attach them
# to a GitHub Release. workflow_dispatch builds artifacts without publishing.
#
# Expected files on a tag:
#   OneAsr_<ver>_setup.exe
#   OneAsr_<ver>_portable.zip
#   OneAsr_<ver>_linux_x64.tar.gz
#   OneAsr_<ver>_linux_x64.deb
#   OneAsr_<ver>_macos_arm64.dmg
#   OneAsr_<ver>_macos_x64.dmg
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(python3 -c "import re,pathlib; t=pathlib.Path('Cargo.toml').read_text(); m=re.search(r'(?m)^version\\s*=\\s*\\\"([^\\\"]+)\\\"', t); print(m.group(1) if m else '')")"
          fi
          [[ -n "$V" ]]
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "OneAsr $V"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Pack
        shell: pwsh
        run: ./scripts/pack-release.ps1 -Version ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/OneAsr_*_setup.exe
            release/OneAsr_*_portable.zip
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config clang \
            libssl-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libx11-dev libxrandr-dev libxcb1-dev \
            libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
      - name: Pack
        run: |
          chmod +x scripts/pack-unix.sh
          ./scripts/pack-unix.sh --version ${{ needs.version.outputs.version }} --os linux --arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            release/OneAsr_*_linux_x64.tar.gz
            release/OneAsr_*_linux_x64.deb
          if-no-files-found: error

  macos-arm64:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-arm64
      - name: Pack
        run: |
          chmod +x scripts/pack-unix.sh
          ./scripts/pack-unix.sh --version ${{ needs.version.outputs.version }} --os macos --arch arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release/OneAsr_*_macos_arm64.dmg
          if-no-files-found: error

  macos-x64:
    needs: version
    runs-on: macos-13
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-x64
      - name: Pack
        run: |
          chmod +x scripts/pack-unix.sh
          ./scripts/pack-unix.sh --version ${{ needs.version.outputs.version }} --os macos --arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: release/OneAsr_*_macos_x64.dmg
          if-no-files-found: error

  publish:
    needs: [version, windows, linux, macos-arm64, macos-x64]
    if: ${{ always() && !cancelled() && needs.windows.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Files
        run: ls -lh out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OneAsr ${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: out/*
