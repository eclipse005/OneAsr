[package]
name = "oneasr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OneAsr desktop app — pure GPUI shell"

[[bin]]
name = "oneasr"
path = "src/main.rs"

[features]
# Single shippable build includes CUDA engines; CPU still works without CUDA DLLs.
# GPU needs user-mode DLLs (download in Settings → CUDA 运行库).
default = ["cuda"]
cuda = ["oneasr-core/cuda"]

[dependencies]
oneasr-core = { workspace = true, default-features = false }
gpui = "0.2.2"
anyhow = { workspace = true }
rfd = "0.15"
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
# Used by `crashlog` for human-readable local timestamps in `oneasr-error.log`.
windows = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
