[package]
name = "oneasr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OneAsr desktop app — Native Shell"
# 只通过 GitHub Release 分发，不进 crates.io；显式声明免得误发。
publish = false

[lib]
name = "oneasr"
path = "src/lib.rs"

[[bin]]
name = "oneasr"
path = "src/main.rs"

[dependencies]
oneasr-core = { workspace = true }
nsh-core = "0.4.0"
nsh-base = "0.4.0"

[target.'cfg(windows)'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
