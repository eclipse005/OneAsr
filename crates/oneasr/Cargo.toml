[package]
name = "oneasr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OneAsr desktop app — pure GPUI shell"

[[bin]]
name = "oneasr"
path = "src/main.rs"

[dependencies]
oneasr-core = { workspace = true }
gpui = "0.2.2"
anyhow = { workspace = true }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
# Used by `crashlog` for human-readable local timestamps in `oneasr-error.log`.
windows = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
