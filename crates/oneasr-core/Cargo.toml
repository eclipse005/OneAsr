[package]
name = "oneasr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qwen ASR + align pipeline and subtitle segmentation for OneAsr"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = "1.10"
jieba-rs = "0.10"
hound = "3.5"
sha2 = "0.10"
# Simplified ⇄ Traditional conversion for Chinese output (pure Rust, Apache-2.0,
# dictionaries compiled into the binary at build time — no runtime files).
ferrous-opencc = "0.4"
punkt = { git = "https://github.com/eclipse005/rust-punkt.git", rev = "ca9187276d9478c0bc67c1cc3cd787de88f6e293" }
qwen3-asr-wgpu = { git = "https://github.com/eclipse005/qwen3-asr-wgpu.git" }
qwen3-aligner-wgpu = { git = "https://github.com/eclipse005/qwen3-aligner-wgpu.git" }
fireredvad = { git = "https://github.com/eclipse005/FireRedVad.git", tag = "v1.0.0" }
# HTDemucs v4 vocals (CPU + wgpu). Same backend policy as ASR/Align.
demucs-core = { git = "https://github.com/eclipse005/demucs-wgpu.git" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "system-proxy"] }

[[bin]]
name = "oneasr-cli"
path = "src/bin/oneasr-cli.rs"
required-features = []
