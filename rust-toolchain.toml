# 工具链单一来源。
#
# 本文件是仓库编译工具链的唯一出处：本地 cargo、CI、三平台发布构建都读它，
# workflow 里不再写死 `stable`（否则 CI 会用「今天的 stable」去构建，而
# Cargo.lock 里的依赖和 rustfmt/clippy 的输出都随版本漂移，问题无法复现）。
# 升级工具链 = 改这一行 + 跑一遍 CI，是一个显式动作。
#
# nsh 0.4 用了 1.97 才稳定的 `isolate_lowest_one`，这条分支因此升到 1.97.0。
# master 仍是 1.96.0。升工具链 = 改这一行，本地与 CI 一起走。
[toolchain]
channel = "1.97.0"
# fmt / clippy 是 CI 的门禁，必须随工具链一起装，否则本地跑不出 CI 的结果。
components = ["rustfmt", "clippy"]
